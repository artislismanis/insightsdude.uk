version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # Fortnightly isn't a Dependabot interval and cron can't express "every
      # other Monday" (day-of-week steps silently run weekly), so this fires on
      # the 1st and 15th of each month instead.
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the whole lint/format/test toolchain.
      toolchain:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - prettier
          - prettier-*
          - stylelint
          - stylelint-*
          - markdownlint
          - markdownlint-*
          - husky
          - lint-staged
          - vitest
          - '@vitest/*'
          - unlighthouse
        update-types: [minor, patch]
      # `eleventy-theme-aurora` is deliberately absent here: it has its own
      # `theme` group below, and Dependabot assigns a dependency to the first
      # group it matches.
      eleventy:
        patterns:
          - '@11ty/*'
          - '@eleventy-plugin-themer/*'
        update-types: [minor, patch]
      build:
        patterns:
          - vite
          - postcss
          - postcss-*
          - cssnano
          - sass-embedded
          - esbuild
        update-types: [minor, patch]
      aws:
        patterns:
          - '@aws-sdk/*'
          - s3-sync-client
        update-types: [minor, patch]
      theme:
        patterns:
          - eleventy-theme-aurora
        update-types: [minor, patch]
      # Catch-all so nothing lands as a solo PR unless it's a major.
      remaining-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors stay ungrouped and arrive one at a time, on purpose.

    # Patch bumps are ignored outright. `update-types` rules apply to version
    # updates only, so Dependabot security updates still raise patch-level PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    # Patch bumps are ignored outright. `update-types` rules apply to version
    # updates only, so Dependabot security updates still raise patch-level PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
